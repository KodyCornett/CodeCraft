<!-- Tailwind CDN — utility classes for layout/spacing. Effects (scanlines, glow,

<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
    :root {
        --term-bg:     #050a07;
        --term-green:  #00ff9d;
        --term-green-dim: rgba(0, 255, 157, 0.35);
        --term-amber:  #fb923c;
        --term-red:    #ff3333;
    }

    * { box-sizing: border-box; }

    body {
        background: var(--term-bg);
        font-family: 'JetBrains Mono', monospace;
        color: var(--term-green);
        margin: 0;
        overflow: hidden;
    }

    /* ── CRT scanline + vignette overlay ─────────────────────────────────── */
    #crt-overlay {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 999;
        background:
            repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.18) 0px,
                rgba(0, 0, 0, 0.18) 1px,
                transparent 1px,
                transparent 3px
            ),
            radial-gradient(ellipse at center, rgba(0,0,0,0) 60%, rgba(0,0,0,0.55) 100%);
        mix-blend-mode: overlay;
        opacity: 0.65;
    }

    #crt-flicker {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 998;
        background: rgba(0, 255, 157, 0.015);
        animation: crt-flicker 6s infinite;
    }

    @keyframes crt-flicker {
        0%, 92%, 100% { opacity: 1; }
        93% { opacity: 0.85; }
        94% { opacity: 1; }
        96% { opacity: 0.9; }
    }

    /* ── Panes ────────────────────────────────────────────────────────────── */
    .term-pane {
        border: 1px solid rgba(0, 255, 157, 0.18);
        background: rgba(4, 14, 9, 0.85);
        box-shadow: inset 0 0 40px rgba(0, 255, 157, 0.03);
        transition: border-color 0.2s, box-shadow 0.2s;
    }

    .term-pane.pane-focused {
        border-color: rgba(0, 255, 157, 0.65);
        box-shadow: inset 0 0 40px rgba(0, 255, 157, 0.06), 0 0 22px rgba(0, 255, 157, 0.12);
    }

    /* ── Scrollbars ───────────────────────────────────────────────────────── */
    .term-scroll::-webkit-scrollbar { width: 6px; }
    .term-scroll::-webkit-scrollbar-track { background: transparent; }
    .term-scroll::-webkit-scrollbar-thumb { background: rgba(0,255,157,0.2); }

    /* ── Nav listing rows ─────────────────────────────────────────────────── */
    .nav-row {
        cursor: pointer;
        transition: background 0.1s, color 0.1s;
        white-space: nowrap;
    }
    .nav-row:hover { background: rgba(0, 255, 157, 0.06); }
    .nav-row.selected {
        background: rgba(0, 255, 157, 0.12);
        color: var(--term-green);
        box-shadow: inset 2px 0 0 var(--term-green);
    }

    /* ── Cipher slots ─────────────────────────────────────────────────────── */
    .slot-wrapper {
        border: 1px solid rgba(0, 255, 157, 0.18);
        transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }
    .slot-wrapper.active {
        border-color: rgba(0, 255, 157, 0.7);
        box-shadow: 0 0 14px rgba(0, 255, 157, 0.18);
    }
    .slot-wrapper.solved {
        border-color: rgba(0, 255, 157, 0.55);
        background: rgba(0, 255, 157, 0.06);
    }

    .slot-input {
        background: rgba(0, 0, 0, 0.4);
        border: 1px solid rgba(0, 255, 157, 0.25);
        color: var(--term-green);
        font-family: 'JetBrains Mono', monospace;
    }
    .slot-input:focus { outline: none; border-color: var(--term-green); }
    .slot-input:disabled {
        color: rgba(0, 255, 157, 0.7);
        border-color: rgba(0, 255, 157, 0.4);
        background: rgba(0, 255, 157, 0.05);
    }

    .slot-input.shake { animation: shake-red 0.35s ease; }
    @keyframes shake-red {
        0%, 100% { transform: translateX(0); border-color: rgba(0,255,157,0.25); }
        20%, 60% { transform: translateX(-4px); border-color: var(--term-red); }
        40%, 80% { transform: translateX(4px); border-color: var(--term-red); }
    }

    /* ── Trace bar ────────────────────────────────────────────────────────── */
    #trace-track {
        background: rgba(0, 255, 157, 0.08);
        height: 8px;
        overflow: hidden;
    }
    #trace-fill {
        height: 100%;
        background: linear-gradient(90deg, #003322, var(--term-green));
        transition: width 0.25s linear, background 0.3s;
    }
    #trace-fill.alert-high { background: linear-gradient(90deg, #4a1500, var(--term-amber)); }
    #trace-fill.alert-critical {
        background: linear-gradient(90deg, #4a0000, var(--term-red));
        animation: trace-pulse 0.5s ease infinite alternate;
    }
    @keyframes trace-pulse {
        from { box-shadow: 0 0 6px rgba(255,51,51,0.4); }
        to   { box-shadow: 0 0 16px rgba(255,51,51,0.8); }
    }

    body.alert-critical-body { animation: body-alert 1s ease infinite; }
    @keyframes body-alert {
        0%, 100% { background: var(--term-bg); }
        50%      { background: #140302; }
    }

    /* ── Modal ────────────────────────────────────────────────────────────── */
    #modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 4, 2, 0.88);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 1000;
    }
    #modal-overlay.visible { display: flex; }

    .modal-box {
        border: 1px solid;
        padding: 32px 40px;
        min-width: 380px;
        text-align: center;
        background: rgba(4, 14, 9, 0.95);
    }
    .modal-box.win  { border-color: var(--term-green); box-shadow: 0 0 40px rgba(0,255,157,0.25); }
    .modal-box.lose { border-color: var(--term-red);   box-shadow: 0 0 40px rgba(255,51,51,0.25); }

    .badge-decoded {
        font-size: 9px;
        letter-spacing: 0.15em;
        color: var(--term-green);
        border: 1px solid rgba(0,255,157,0.4);
        padding: 1px 6px;
    }

    ::selection { background: rgba(0,255,157,0.3); }
</style>

<script>
'use strict';

/* ════════════════════════════════════════════════════════════════════════
   ARCHIVE EXTRACTION — prototype
   A dual-pane terminal hacking game: read scattered log files in a
   procedurally generated directory tree to find plaintext/Base64 pairs,
   match each pair's ciphertext to one of three target slots, and decode
   all three before the Trace Level reaches 100%.
   ════════════════════════════════════════════════════════════════════════ */

/* ── Constants ──────────────────────────────────────────────────────────── */

const WORDS = [
    'ghost', 'trace', 'vault', 'cipher', 'shadow', 'signal', 'breach', 'static',
    'wraith', 'axiom', 'uplink', 'kernel', 'daemon', 'router', 'packet', 'proxy',
    'nexus', 'splice', 'cache', 'relay', 'forge', 'byte',
];

const FOLDER_NAMES = [
    'sys_cache', 'audit_trail', 'user_partitions', 'archive_root', 'ghost_sectors',
    'corp_backups', 'watchdog_logs', 'node_diagnostics', 'residual_data',
    'session_vault', 'ice_quarantine', 'packet_captures', 'legacy_shard',
];

const FILE_NAMES = [
    'session.log', 'auth_trace.log', 'node_diag.txt', 'packet_dump.log',
    'watchdog.log', 'residual.dat', 'handshake.log', 'cache_flush.txt',
    'audit_01.log', 'sector_scan.dat', 'trace_report.log', 'checksum.dat',
    'link_status.log', 'archive_index.txt',
];

const BASE_TRACE_DURATION_MS = 130000; // baseline time to fill trace from 0-100 with no mistakes
const TRACE_TICK_MS          = 200;
const TRACE_TICK_AMOUNT      = 100 / (BASE_TRACE_DURATION_MS / TRACE_TICK_MS);
const WRONG_GUESS_PENALTY    = 4; // % trace added per incorrect submit

/* ── Utilities ──────────────────────────────────────────────────────────── */

function randInt(min, max) { return Math.floor(min + Math.random() * (max - min + 1)); }
function pick(arr) { return arr[randInt(0, arr.length - 1)]; }

function sampleDistinct(arr, n) {
    const pool = [...arr];
    const out = [];
    while (out.length < n && pool.length > 0) {
        const idx = randInt(0, pool.length - 1);
        out.push(pool.splice(idx, 1)[0]);
    }
    return out;
}

function ts() {
    const h = String(randInt(0, 23)).padStart(2, '0');
    const m = String(randInt(0, 59)).padStart(2, '0');
    const s = String(randInt(0, 59)).padStart(2, '0');
    return `${h}:${m}:${s}`;
}
function hex(n) {
    return Array.from({ length: n }, () => randInt(0, 15).toString(16)).join('').toUpperCase();
}
function arcAddr()   { return `ARC.10.${randInt(0, 255)}.${randInt(0, 255)}`; }
function ghostAddr() { return `GHK.00.${randInt(0, 255)}.${randInt(0, 255)}`; }

/* ── Flavor line generation (decoy / ambient content) ─────────────────────── */

const FLAVOR_GENERATORS = [
    () => `[${ts()}] watchdog: link nominal`,
    () => `[${ts()}] handshake retry — packet malformed`,
    () => `[${ts()}] ICE_SWEEP // ${arcAddr()} — no match`,
    () => `[${ts()}] GHOST_ECHO // ${ghostAddr()} — dismissed`,
    () => `%$#@ CORRUPT SECTOR 0x${hex(4)} — recovery failed`,
    () => `ENCODED: '${hex(6)}==' [CHECKSUM FAIL]`,
    () => `[${ts()}] node integrity nominal`,
    () => `[${ts()}] session idle — no anomalies`,
    () => `// SPLICE AUDIT — fragment ${hex(3)}`,
    () => `[${ts()}] archive index rebuilt (${randInt(100, 999)} entries)`,
    () => `[${ts()}] trace vector unresolved`,
    () => `>>> buffer flush complete`,
    () => `[${ts()}] cache miss — sector 0x${hex(3)}`,
    () => `[${ts()}] axiom relay: heartbeat ok`,
    () => `#### fragment unreadable — skipping ####`,
];

function sampleFlavorLines(min, max) {
    const n = randInt(min, max);
    return Array.from({ length: n }, () => pick(FLAVOR_GENERATORS)());
}

function insertAtRandomPosition(lines, extra) {
    const copy = [...lines];
    copy.splice(randInt(0, copy.length), 0, extra);
    return copy;
}

function buildTargetContent(word, b64) {
    const lines = sampleFlavorLines(3, 5);
    return insertAtRandomPosition(lines, `TOKEN: '${word}' | ENCODED: '${b64}'`).join('\n');
}
function buildFakePairContent(word, b64) {
    const lines = sampleFlavorLines(2, 4);
    return insertAtRandomPosition(lines, `TOKEN: '${word}' | ENCODED: '${b64}'`).join('\n');
}
function buildNoiseContent() {
    return sampleFlavorLines(4, 6).join('\n');
}

/* ── Procedural directory tree ─────────────────────────────────────────────
   Builds a 2-3 level folder tree, then scatters 3 target log files (each
   containing one TOKEN/ENCODED pair matching a cipher slot) plus 2-5 decoy
   files (fake pairs for non-target words, or pure noise) across it.
   ════════════════════════════════════════════════════════════════════════ */

function buildFolderTree() {
    const used = new Set();
    function folderName() {
        let n;
        do { n = pick(FOLDER_NAMES); } while (used.has(n) && used.size < FOLDER_NAMES.length);
        used.add(n);
        return n;
    }

    const root = { name: 'root', type: 'dir', children: [] };
    const topCount = randInt(2, 3);
    for (let i = 0; i < topCount; i++) {
        const folder = { name: folderName(), type: 'dir', children: [] };
        root.children.push(folder);
        if (Math.random() < 0.85) {
            const subCount = randInt(1, 2);
            for (let j = 0; j < subCount; j++) {
                const sub = { name: folderName(), type: 'dir', children: [] };
                folder.children.push(sub);
                if (Math.random() < 0.25) {
                    sub.children.push({ name: folderName(), type: 'dir', children: [] });
                }
            }
        }
    }
    return root;
}

function flattenFolders(node, acc) {
    acc = acc || [];
    acc.push(node);
    node.children.forEach(c => { if (c.type === 'dir') flattenFolders(c, acc); });
    return acc;
}

function uniqueFileNameFor(folder) {
    const existing = new Set(folder.children.filter(c => c.type === 'file').map(c => c.name));
    let candidates = FILE_NAMES.filter(n => !existing.has(n));
    if (candidates.length === 0) candidates = FILE_NAMES;
    let name = pick(candidates);
    let suffix = 1;
    while (existing.has(name)) { name = `${pick(FILE_NAMES).replace(/\.[^.]+$/, '')}_${suffix}.log`; suffix++; }
    return name;
}

function generateWorld() {
    const root = buildFolderTree();
    const allFolders = flattenFolders(root);

    const targetWords = sampleDistinct(WORDS, 3);
    const remainingPool = WORDS.filter(w => !targetWords.includes(w));
    const decoyPairWords = sampleDistinct(remainingPool, Math.min(2, remainingPool.length));

    const totalFiles = randInt(5, 8);

    // Place target files in distinct folders when possible (scattered, not clumped).
    let targetFolders = sampleDistinct(allFolders, Math.min(3, allFolders.length));
    while (targetFolders.length < 3) targetFolders.push(allFolders[targetFolders.length % allFolders.length]);

    const targets = targetWords.map((word, i) => {
        const b64 = btoa(word);
        const folder = targetFolders[i];
        const file = {
            name: uniqueFileNameFor(folder),
            type: 'file',
            kind: 'target',
            word, b64,
            content: buildTargetContent(word, b64),
        };
        folder.children.push(file);
        return { word, b64, solved: false };
    });

    const remainingCount = Math.max(0, totalFiles - 3);
    for (let i = 0; i < remainingCount; i++) {
        const folder = pick(allFolders);
        let content, kind;
        if (decoyPairWords.length > 0 && Math.random() < 0.5) {
            const w = pick(decoyPairWords);
            content = buildFakePairContent(w, btoa(w));
            kind = 'decoy-pair';
        } else {
            content = buildNoiseContent();
            kind = 'decoy-noise';
        }
        folder.children.push({ name: uniqueFileNameFor(folder), type: 'file', kind, content });
    }

    return { root, targets };
}

/* ── Game state ─────────────────────────────────────────────────────────── */

let state = null;
let traceIntervalId = null;
let elapsedIntervalId = null;

function initGame() {
    if (traceIntervalId) clearInterval(traceIntervalId);
    if (elapsedIntervalId) clearInterval(elapsedIntervalId);

    const world = generateWorld();

    state = {
        root: world.root,
        targets: world.targets,       // [{word, b64, solved}]
        path: [],                     // array of child indices from root
        openFileNode: null,           // file node currently being read, or null
        navIndex: 0,                  // selected row index within current listing
        focusPane: 'nav',             // 'nav' | 'decoder'
        activeSlotIndex: 0,
        gameState: 'playing',         // 'playing' | 'won' | 'lost'
        traceLevel: 0,
        elapsedSec: 0,
    };

    document.getElementById('modal-overlay').classList.remove('visible');
    document.body.classList.remove('alert-critical-body');

    renderNavListing();
    renderSlotList();
    updatePaneFocusGlow();
    updateTraceBar();
    document.getElementById('timer').textContent = 'T+000s';

    traceIntervalId = setInterval(traceTick, TRACE_TICK_MS);
    elapsedIntervalId = setInterval(() => {
        if (state.gameState !== 'playing') return;
        state.elapsedSec++;
        document.getElementById('timer').textContent = `T+${String(state.elapsedSec).padStart(3, '0')}s`;
    }, 1000);
}

/* ── Tree navigation helpers ────────────────────────────────────────────── */

function resolveFolder(path) {
    let node = state.root;
    for (const idx of path) node = node.children[idx];
    return node;
}

function currentEntries() {
    const folder = resolveFolder(state.path);
    const entries = [];
    if (state.path.length > 0) entries.push({ type: 'up' });
    folder.children.forEach((c, idx) => entries.push({ type: c.type, node: c, idx }));
    return entries;
}

/* ── Rendering: File Navigator ──────────────────────────────────────────── */

function renderBreadcrumb() {
    const el = document.getElementById('nav-breadcrumb');
    if (state.path.length === 0) { el.textContent = 'root/'; return; }
    let node = state.root;
    const parts = ['root'];
    for (const idx of state.path) { node = node.children[idx]; parts.push(node.name); }
    el.textContent = parts.join('/') + '/';
}

function renderNavListing() {
    renderBreadcrumb();
    const container = document.getElementById('nav-listing');

    if (state.openFileNode) {
        const f = state.openFileNode;
        container.innerHTML = `
            <div class="mb-2 pb-2 border-b" style="border-color: rgba(0,255,157,0.12); color: rgba(0,255,157,0.55);">
                &gt; ${escapeHtml(f.name)}
            </div>
            <pre class="whitespace-pre-wrap break-all text-[10px] leading-5" style="color: rgba(0,255,157,0.7);">${escapeHtml(f.content)}</pre>
        `;
        return;
    }

    const entries = currentEntries();
    if (state.navIndex >= entries.length) state.navIndex = Math.max(0, entries.length - 1);

    container.innerHTML = entries.map((entry, i) => {
        const selected = i === state.navIndex ? 'selected' : '';
        if (entry.type === 'up') {
            return `<div class="nav-row px-2 py-0.5 ${selected}" data-nav-idx="${i}" style="color: rgba(0,255,157,0.4);">.. [UP]</div>`;
        }
        if (entry.type === 'dir') {
            return `<div class="nav-row px-2 py-0.5 ${selected}" data-nav-idx="${i}" style="color: rgba(0,255,157,0.75);">[DIR] ${escapeHtml(entry.node.name)}/</div>`;
        }
        return `<div class="nav-row px-2 py-0.5 ${selected}" data-nav-idx="${i}" style="color: rgba(0,255,157,0.55);">&nbsp;&nbsp;&nbsp;&nbsp;${escapeHtml(entry.node.name)}</div>`;
    }).join('');

    container.querySelectorAll('.nav-row').forEach(row => {
        row.addEventListener('click', () => {
            setFocusPane('nav');
            state.navIndex = parseInt(row.dataset.navIdx, 10);
            renderNavListing();
            activateNavEntry();
        });
    });
}

function activateNavEntry() {
    const entries = currentEntries();
    const entry = entries[state.navIndex];
    if (!entry) return;

    if (entry.type === 'up') {
        state.path.pop();
        state.navIndex = 0;
        state.openFileNode = null;
    } else if (entry.type === 'dir') {
        state.path.push(entry.idx);
        state.navIndex = 0;
        state.openFileNode = null;
    } else if (entry.type === 'file') {
        state.openFileNode = entry.node;
    }
    renderNavListing();
}

function navBack() {
    if (state.openFileNode) {
        state.openFileNode = null;
    } else if (state.path.length > 0) {
        state.path.pop();
        state.navIndex = 0;
    }
    renderNavListing();
}

function moveNav(delta) {
    if (state.openFileNode) return; // reading a file — arrows don't scroll the list
    const entries = currentEntries();
    if (entries.length === 0) return;
    state.navIndex = (state.navIndex + delta + entries.length) % entries.length;
    renderNavListing();
}

/* ── Rendering: Cipher Decoder ──────────────────────────────────────────── */

function renderSlotList() {
    const container = document.getElementById('slot-list');
    container.innerHTML = state.targets.map((t, i) => `
        <div id="slot-wrapper-${i}" class="slot-wrapper px-3 py-2 flex flex-col gap-2">
            <div class="flex items-center justify-between">
                <span class="text-[9px] tracking-[0.12em]" style="color: rgba(0,255,157,0.4);">SLOT_0${i + 1}</span>
                <span id="slot-badge-${i}" class="badge-decoded" style="visibility: hidden;">✔ DECODED</span>
            </div>
            <div class="text-[12px]" style="color: rgba(0,255,157,0.8);">
                TARGET: <span style="color: var(--term-amber);">'${t.b64}'</span>
            </div>
            <div class="flex items-center gap-2">
                <input id="slot-input-${i}" class="slot-input px-2 py-1 flex-1 text-[12px]"
                    placeholder="deduced plaintext..." autocomplete="off" spellcheck="false" />
                <button class="text-[9px] tracking-[0.1em] border px-2 py-1"
                    style="border-color: rgba(0,255,157,0.3); color: rgba(0,255,157,0.6);"
                    onclick="submitSlot(${i})">[ DECODE ]</button>
            </div>
        </div>
    `).join('');

    state.targets.forEach((t, i) => {
        const input = document.getElementById(`slot-input-${i}`);
        input.addEventListener('focus', () => {
            state.focusPane = 'decoder';
            state.activeSlotIndex = i;
            updatePaneFocusGlow();
            updateSlotHighlight();
        });
        input.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowDown') { e.preventDefault(); moveSlot(1); }
            else if (e.key === 'ArrowUp') { e.preventDefault(); moveSlot(-1); }
            else if (e.key === 'Enter') { e.preventDefault(); submitSlot(i); }
        });
        if (t.solved) lockSlot(i, t.word, false);
    });

    updateSlotHighlight();
    updateSolvedCount();
}

function updateSlotHighlight() {
    for (let i = 0; i < state.targets.length; i++) {
        const wrapper = document.getElementById(`slot-wrapper-${i}`);
        if (!wrapper) continue;
        wrapper.classList.toggle('active', state.focusPane === 'decoder' && i === state.activeSlotIndex);
    }
}

function updateSolvedCount() {
    const solved = state.targets.filter(t => t.solved).length;
    document.getElementById('solved-count').textContent = `${solved}/3 DECODED`;
}

function focusActiveSlotInput() {
    // Skip already-solved slots when focusing programmatically.
    const n = state.targets.length;
    let i = state.activeSlotIndex;
    let attempts = 0;
    while (state.targets[i].solved && attempts < n) {
        i = (i + 1) % n;
        attempts++;
    }
    state.activeSlotIndex = i;
    const input = document.getElementById(`slot-input-${i}`);
    if (input && !input.disabled) input.focus();
    updateSlotHighlight();
}

function moveSlot(delta) {
    const n = state.targets.length;
    let i = state.activeSlotIndex;
    for (let attempts = 0; attempts < n; attempts++) {
        i = (i + delta + n) % n;
        if (!state.targets[i].solved) break;
    }
    state.activeSlotIndex = i;
    const input = document.getElementById(`slot-input-${i}`);
    if (input) input.focus();
    updateSlotHighlight();
}

function lockSlot(i, word, animate) {
    const wrapper = document.getElementById(`slot-wrapper-${i}`);
    const input = document.getElementById(`slot-input-${i}`);
    const badge = document.getElementById(`slot-badge-${i}`);
    wrapper.classList.add('solved');
    input.value = word;
    input.disabled = true;
    badge.style.visibility = 'visible';
    if (animate !== false) {
        wrapper.style.transition = 'none';
    }
}

function flashWrongSlot(i) {
    const input = document.getElementById(`slot-input-${i}`);
    input.classList.remove('shake');
    // Force reflow so the animation can restart if triggered again quickly.
    void input.offsetWidth;
    input.classList.add('shake');
    setTimeout(() => input.classList.remove('shake'), 400);
}

function submitSlot(i) {
    if (state.gameState !== 'playing') return;
    const target = state.targets[i];
    if (target.solved) return;

    const input = document.getElementById(`slot-input-${i}`);
    const guess = input.value.trim().toLowerCase();

    if (guess.length > 0 && guess === target.word) {
        target.solved = true;
        lockSlot(i, target.word);
        updateSolvedCount();
        if (state.targets.every(t => t.solved)) {
            triggerVictory();
        } else {
            moveSlot(1);
        }
    } else {
        flashWrongSlot(i);
        bumpTrace(WRONG_GUESS_PENALTY);
    }
}

/* ── Pane focus ─────────────────────────────────────────────────────────── */

function setFocusPane(pane) {
    state.focusPane = pane;
    updatePaneFocusGlow();
    if (pane === 'decoder') focusActiveSlotInput();
    else updateSlotHighlight();
}

function togglePane() {
    setFocusPane(state.focusPane === 'nav' ? 'decoder' : 'nav');
}

function updatePaneFocusGlow() {
    document.getElementById('nav-pane').classList.toggle('pane-focused', state.focusPane === 'nav');
    document.getElementById('decoder-pane').classList.toggle('pane-focused', state.focusPane === 'decoder');
}

/* ── Trace level ────────────────────────────────────────────────────────── */

function traceTick() {
    if (state.gameState !== 'playing') return;
    bumpTrace(TRACE_TICK_AMOUNT);
}

function bumpTrace(amount) {
    state.traceLevel = Math.min(100, state.traceLevel + amount);
    updateTraceBar();
    if (state.traceLevel >= 100) triggerDefeat();
}

function updateTraceBar() {
    const fill = document.getElementById('trace-fill');
    const pct = document.getElementById('trace-pct');
    fill.style.width = `${state.traceLevel}%`;
    pct.textContent = `${Math.round(state.traceLevel)}%`;

    fill.classList.remove('alert-high', 'alert-critical');
    document.body.classList.remove('alert-critical-body');
    if (state.traceLevel >= 85) {
        fill.classList.add('alert-critical');
        document.body.classList.add('alert-critical-body');
    } else if (state.traceLevel >= 60) {
        fill.classList.add('alert-high');
    }
}

/* ── Win / lose ─────────────────────────────────────────────────────────── */

function triggerVictory() {
    state.gameState = 'won';
    clearInterval(traceIntervalId);
    clearInterval(elapsedIntervalId);
    showModal('win', 'VAULT BREACHED', `Packet extracted intact in ${state.elapsedSec}s.<br>Axiom will want the full report.`);
}

function triggerDefeat() {
    state.gameState = 'lost';
    clearInterval(traceIntervalId);
    clearInterval(elapsedIntervalId);
    showModal('lose', 'SECURITY LOCKDOWN', `Trace vector resolved. ICE has your position.<br>Extraction aborted at ${Math.round(state.traceLevel)}% trace.`);
}

function showModal(kind, title, bodyHtml) {
    const box = document.getElementById('modal-box');
    box.classList.remove('win', 'lose');
    box.classList.add(kind);
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-title').style.color = kind === 'win' ? 'var(--term-green)' : 'var(--term-red)';
    document.getElementById('modal-body').innerHTML = bodyHtml;
    document.getElementById('modal-overlay').classList.add('visible');
}

/* ── Global keyboard handling ───────────────────────────────────────────── */

document.addEventListener('keydown', (e) => {
    if (!state) return;

    if (state.gameState !== 'playing') {
        if (e.key === 'Enter') { e.preventDefault(); initGame(); }
        return;
    }

    if (e.key === 'Tab') { e.preventDefault(); togglePane(); return; }

    if (state.focusPane === 'nav') {
        if (e.key === 'ArrowDown') { e.preventDefault(); moveNav(1); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); moveNav(-1); }
        else if (e.key === 'Enter') { e.preventDefault(); activateNavEntry(); }
        else if (e.key === 'Escape') { e.preventDefault(); navBack(); }
    }
    // Decoder-pane Arrow/Enter handling lives on the slot inputs themselves
    // (see renderSlotList) so normal typing isn't intercepted here.
});

document.getElementById('nav-pane').addEventListener('click', () => {
    if (state && state.gameState === 'playing') setFocusPane('nav');
});

document.getElementById('restart-btn').addEventListener('click', initGame);
document.getElementById('modal-restart-btn').addEventListener('click', initGame);

/* ── Misc ───────────────────────────────────────────────────────────────── */

function escapeHtml(str) {
    return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
}

/* ── Boot ───────────────────────────────────────────────────────────────── */

initGame();
</script>
